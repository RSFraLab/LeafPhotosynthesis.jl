# Builds the documentation (Documenter + DocumenterVitepress; strict: doctests,
# cross-references, public docstrings, chart-data checks) on every pull request and push.
# Deployment to the gh-pages branch happens only for pushes to main (…/dev/) and for tags
# (…/vX.Y.Z/ and …/stable/); pull-request builds are checks without deployment.
# Node.js comes from DocumenterVitepress (NodeJS_20_jll); the npm packages are installed
# from docs/package-lock.json during the build.
name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # deploy to gh-pages
  pull-requests: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}   # optional; GITHUB_TOKEN suffices
        run: julia --project=docs docs/make.jl
